name: paper-trading

# 24/7 in the cloud: every hour run the routine, commit fresh data and publish the site to GitHub Pages.
on:
  schedule:
    - cron: "7 * * * *"      # hourly at :07 UTC (GitHub may delay the start by a few minutes)
  workflow_dispatch: {}        # manual run button
  push:
    branches: [main]
    paths:
      - "site/**"
      - ".github/workflows/paper.yml"

permissions:
  contents: write   # коммит обновлённого состояния
  pages: write      # публикация на Pages
  id-token: write   # деплой Pages

concurrency:
  group: pages
  cancel-in-progress: true   # a new run supersedes a stuck/older one instead of queuing behind it

jobs:
  run-and-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10        # never let a run hang for hours
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install deps
        run: pip install --quiet pandas numpy
      - name: Run paper trading
        run: python paper_trade.py
      - name: Commit updated data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add site/paper.js paper_state.json
          if git diff --cached --quiet; then
            echo "No changes"
          else
            git commit -m "paper: update $(date -u +%FT%TZ)"
            git push
          fi
      - name: Setup Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true
      - name: Upload site
        uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - name: Deploy to Pages
        id: deploy
        continue-on-error: true   # transient GitHub Pages hiccups shouldn't fail the run; data is already committed and the next hourly run redeploys
        uses: actions/deploy-pages@v4
